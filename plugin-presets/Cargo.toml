[package]
name = "plugin-presets"
version = "0.1.0"
edition = "2021"

[lib]
name = "plugin_presets"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
dunce = "1"
serde = { version = "1", features = ["derive"] }
xmltree = "0.11"
mlua = { version = "0.12", features = ["lua54", "vendored", "anyhow"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
