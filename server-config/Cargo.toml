[package]
name = "cmrt-server-config"
version = "0.1.0"
edition = "2021"

[lib]
name = "cmrt_server_config"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
dirs = "6"
dunce = "1"
plugin-presets = { path = "../plugin-presets" }
serde = { version = "1", features = ["derive"] }
toml = "1"
clack-host = { git = "https://github.com/prokopyl/clack.git", package = "clack-host" }
clap-sys = "0.5"
