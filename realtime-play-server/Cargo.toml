[package]
name = "clap-mml-realtime-play-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clap-mml-realtime-play-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
cmrt-core = { path = "../core-lib" }
cmrt-realtime-ipc = { path = "../realtime-ipc" }
cmrt-runtime = { git = "https://github.com/cat2151/clap-mml-render-tui.git", package = "cmrt-runtime" }
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
