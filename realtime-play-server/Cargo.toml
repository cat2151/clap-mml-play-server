[package]
name = "clap-mml-realtime-play-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clap-mml-realtime-play-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.17"
cmrt-core = { path = "../core-lib" }
cmrt-clack-timeline = { path = "../clack-timeline" }
cmrt-realtime-ipc = { path = "../realtime-ipc" }
cmrt-timeline = { path = "../timeline" }
cmrt-server-config = { path = "../server-config" }
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
