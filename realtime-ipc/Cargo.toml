[package]
name = "cmrt-realtime-ipc"
version = "0.1.0"
edition = "2021"

[lib]
name = "cmrt_realtime_ipc"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }
